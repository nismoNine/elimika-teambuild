<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Elimika — Safari ya Akili</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root {
  --sky: #CFEBFA; --sky2: #EAF7FF; --ink: #1B1F3B; --ink2: #4A5073;
  --paper: #FFFFFF; --soft: #EEF3FF; --mute: #DDE3F3;
  --sun: #FFC933; --sun-d: #D9A000; --leaf: #2DB84C; --leaf-d: #1E8A37;
  --lake: #1EA0E0; --lake-d: #117AB0; --clay: #E8572A; --clay-d: #B83C15;
  --kanga: #FF5FA2; --grape: #7B4FD6; --good: #D5F5D9; --warn: #FFF3C4;
  --hill: #A8DE8A; --hill2: #7CC76B;
  --f-display: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --f-body: 'Andika', 'Trebuchet MS', system-ui, sans-serif;
  --shadow: 0 5px 0 var(--ink);
  --gut-l: max(14px, env(safe-area-inset-left, 0px));
  --gut-r: max(14px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; overflow-x: clip; min-height: 100%; }
body {
  background: var(--sky); color: var(--ink);
  font: 17px/1.4 var(--f-body);
  padding: env(safe-area-inset-top, 0px) var(--gut-r) env(safe-area-inset-bottom, 0px) var(--gut-l);
  touch-action: manipulation; user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:disabled { cursor: default; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.1; margin: 0; }
h2 { font-size: 26px; font-weight: 800; }
h3 { font-size: 20px; font-weight: 800; }
#app { max-width: 560px; margin: 0 auto; position: relative; z-index: 1; padding-bottom: 16px; }

/* Background */
#bg {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  background:
    radial-gradient(circle at 20% 15%, rgba(255,255,255,.7) 0 2px, transparent 3px) 0 0 / 46px 46px,
    linear-gradient(180deg, var(--sky) 0%, var(--sky2) 70%);
}
#bg .hills {
  position: absolute; left: -10%; right: -10%; bottom: 0; height: 22%;
  background:
    radial-gradient(120% 100% at 25% 100%, var(--hill) 0 58%, transparent 59%),
    radial-gradient(110% 100% at 80% 100%, var(--hill2) 0 52%, transparent 53%);
}
#bg .cloud {
  position: absolute; width: 90px; height: 30px; background: #fff;
  border-radius: 30px; border: 3px solid var(--ink); opacity: .9;
  animation: drift 60s linear infinite;
}
#bg .cloud::before {
  content: ""; position: absolute; left: 14px; top: -16px; width: 36px; height: 30px;
  background: #fff; border: 3px solid var(--ink); border-bottom: 0; border-radius: 30px 30px 0 0;
}
#bg .c1 { top: 10%; left: -120px; }
#bg .c2 { top: 28%; left: -120px; animation-duration: 90s; animation-delay: -40s; transform: scale(.7); }
@keyframes drift { to { transform: translateX(calc(100vw + 260px)); } }

.strip {
  width: 100vw; margin-left: calc(50% - 50vw); height: 14px;
  background: repeating-linear-gradient(90deg, var(--leaf) 0 28px, var(--ink) 28px 32px, var(--sun) 32px 60px, var(--ink) 60px 64px, var(--lake) 64px 92px, var(--ink) 92px 96px, var(--clay) 96px 124px, var(--ink) 124px 128px);
  border-bottom: 3px solid var(--ink);
}

/* Core Buttons & Cards */
.btn {
  --bg: var(--paper); --fg: var(--ink);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 54px; padding: 8px 22px; background: var(--bg); color: var(--fg);
  border: 3px solid var(--ink); border-radius: 20px; box-shadow: var(--shadow);
  font: 800 20px/1 var(--f-display); transition: transform .08s, box-shadow .08s;
}
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.btn:disabled { opacity: .45; box-shadow: 0 2px 0 var(--ink); transform: translateY(3px); }
.btn.sm { min-height: 42px; padding: 6px 14px; font-size: 16px; border-radius: 14px; box-shadow: 0 4px 0 var(--ink); }
.btn.big { min-height: 68px; font-size: 26px; padding: 10px 34px; border-radius: 24px; }
.btn-leaf { --bg: var(--leaf); --fg: #fff; }
.btn-sun { --bg: var(--sun); }
.btn-clay { --bg: var(--clay); --fg: #fff; }
.btn-lake { --bg: var(--lake); --fg: #fff; }
.btn-ghost { --bg: var(--paper); }

.iconbtn {
  width: 48px; height: 48px; display: grid; place-items: center;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 16px;
  box-shadow: 0 4px 0 var(--ink); flex: none;
}
.iconbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.ico { width: 24px; height: 24px; flex: none; vertical-align: middle; }
.card { background: var(--paper); border: 3px solid var(--ink); border-radius: 22px; box-shadow: var(--shadow); padding: 14px; }

/* Characters & Animations */
.crt { display: block; width: 100%; height: auto; overflow: visible; animation: bob 3.4s ease-in-out infinite; transform-origin: 50% 92%; }
.crt .eyes { animation: blink 5s infinite; transform-box: fill-box; transform-origin: center; }
@keyframes bob { 50% { transform: translateY(-4px) rotate(-1deg); } }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
@keyframes popIn { from { transform: scale(.65) translateY(18px); opacity: 0; } }
@keyframes rightPop { 40% { transform: scale(1.08); } }
@keyframes gentleWobble { 25% { transform: rotate(-4deg) scale(.97); } 75% { transform: rotate(4deg) scale(.97); } }

/* Next-Tap Signifier & Errorless Scaffolding */
.go, .play, .next-pulse, .node.now {
  animation: nextPulse 1.5s infinite;
}
@keyframes nextPulse {
  0% { box-shadow: 0 5px 0 var(--ink), 0 0 0 0 rgba(255, 201, 51, .95); transform: scale(1); }
  50% { box-shadow: 0 6px 0 var(--ink), 0 0 0 14px rgba(255, 201, 51, 0); transform: scale(1.04); }
  100% { box-shadow: 0 5px 0 var(--ink), 0 0 0 0 rgba(255, 201, 51, 0); transform: scale(1); }
}
.gone {
  opacity: .28 !important;
  filter: grayscale(.85);
  transform: scale(.93);
  pointer-events: none;
  transition: opacity .35s, transform .35s, filter .35s;
}
.glow {
  background: #FFF2B2 !important;
  border-color: var(--leaf-d) !important;
  box-shadow: 0 6px 0 var(--ink), 0 0 0 6px rgba(45, 184, 76, .45) !important;
  animation: guideGlow 1.1s infinite ease-in-out;
}
@keyframes guideGlow {
  50% { transform: translateY(-4px) scale(1.04); box-shadow: 0 8px 0 var(--ink), 0 0 0 12px rgba(45, 184, 76, .15) !important; }
}
.coach-guide {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--warn); border: 3px solid var(--ink); border-radius: 18px;
  padding: 6px 14px; font: 800 18px var(--f-display); animation: popIn .3s;
}

/* Phase 0: Reusable 2-second Ghost Hand */
.ghost-hand {
  position: fixed; z-index: 95; width: 64px; height: 64px; pointer-events: none;
  filter: drop-shadow(0 5px 0 rgba(27,31,59,.45));
  transition: opacity .25s;
}
.ghost-hand.tap { animation: ghostTap 2s infinite ease-in-out; }
.ghost-hand.drag { animation: ghostDrag 2s infinite ease-in-out; }
@keyframes ghostTap {
  0%, 100% { transform: translate(-15%, -10%) scale(1.08); opacity: .95; }
  45% { transform: translate(-15%, -4%) scale(.84); opacity: 1; }
  65% { transform: translate(-15%, -10%) scale(1.02); opacity: .95; }
}
@keyframes ghostDrag {
  0% { transform: translate(0, 0) scale(1.05); opacity: 0; }
  15% { transform: translate(0, 0) scale(.9); opacity: 1; }
  75% { transform: translate(var(--dx, 0px), var(--dy, 120px)) scale(.9); opacity: 1; }
  100% { transform: translate(var(--dx, 0px), var(--dy, 120px)) scale(1.05); opacity: 0; }
}

/* Subtitles (#sub with word highlighting) */
#sub {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 92px);
  transform: translate(-50%, 10px); max-width: min(500px, calc(100vw - 24px));
  background: rgba(27,31,59,.94); color: #fff; padding: 8px 16px;
  border-radius: 16px; border: 3px solid var(--ink);
  font: 700 19px/1.3 var(--f-body); z-index: 70;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; text-align: center;
}
#sub.on { opacity: 1; transform: translate(-50%, 0); }
#sub span.hl { background: var(--sun); color: var(--ink); border-radius: 6px; padding: 0 5px; font-weight: 800; }
body[data-scr="lesson"] #sub, body[data-scr="micro"] #sub {
  bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 64px); font-size: 17px; padding: 6px 14px;
}

/* Start Screen (Seconds 0-5) */
.start-scr {
  min-height: 92dvh; display: flex; flex-direction: column; justify-content: space-between;
  align-items: center; text-align: center; padding-bottom: 24px;
}
.start-top {
  width: 100%; display: flex; justify-content: space-between; align-items: center; padding-top: 12px;
}
.langtog {
  display: inline-flex; border: 3px solid var(--ink); border-radius: 14px;
  overflow: hidden; background: #fff; box-shadow: 0 3px 0 var(--ink);
}
.langtog button { padding: 6px 14px; font: 800 17px var(--f-display); min-width: 48px; }
.langtog .on { background: var(--sun); }
.start-hero {
  display: grid; justify-items: center; gap: 14px; margin: auto 0;
}
.start-cast {
  display: flex; align-items: flex-end; justify-content: center; gap: 8px; width: 100%;
}
.start-cast .c-main { width: 150px; }
.start-cast .c-side { width: 104px; }
.start-title { font-size: 42px; font-weight: 800; letter-spacing: -.01em; text-shadow: 0 3px 0 #fff; }
.play-cta {
  width: 124px; height: 124px; border-radius: 50%; background: var(--leaf); color: #fff;
  border: 4px solid var(--ink); display: grid; place-items: center;
  box-shadow: 0 8px 0 var(--ink);
}
.play-cta:active { transform: translateY(5px); box-shadow: 0 3px 0 var(--ink); }
.play-cta svg { width: 58px; height: 58px; margin-left: 6px; }
.start-profiles { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.mini-prof {
  display: flex; align-items: center; gap: 8px; background: #fff; border: 3px solid var(--ink);
  border-radius: 99px; padding: 4px 14px 4px 6px; box-shadow: 0 3px 0 var(--ink);
  font: 800 17px var(--f-display);
}
.mini-prof .av { width: 38px; }

/* Phase 0: Instant Mango Basket Micro-Activity */
.micro-scr {
  min-height: 92dvh; display: flex; flex-direction: column; justify-content: space-between;
  align-items: center; padding-bottom: 24px;
}
.micro-tree {
  position: relative; width: 100%; height: 270px; margin-top: 12px;
  background: radial-gradient(circle at 50% 42%, #47B849 0 42%, #2E8F34 43% 46%, transparent 47%);
  display: flex; align-items: center; justify-content: center; gap: 22px;
}
.mango-btn {
  width: 96px; height: 96px; border-radius: 50%; background: #FFF7D6;
  border: 4px solid var(--ink); box-shadow: 0 6px 0 var(--ink);
  display: grid; place-items: center; transition: transform .25s, opacity .3s;
  animation: mangoBounce 1.8s infinite ease-in-out;
}
.mango-btn:nth-child(2) { animation-delay: .3s; margin-top: -34px; }
.mango-btn:nth-child(3) { animation-delay: .6s; }
@keyframes mangoBounce { 50% { transform: translateY(-10px) rotate(4deg); } }
.mango-btn.picked { transform: translateY(150px) scale(.2); opacity: 0; pointer-events: none; }
.basket-zone {
  width: 240px; min-height: 118px; background: #D99B52; border: 4px solid var(--ink);
  border-radius: 18px 18px 44px 44px; box-shadow: 0 6px 0 var(--ink);
  display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px;
  position: relative;
}
.basket-slot {
  width: 56px; height: 56px; border-radius: 50%; border: 3px dashed rgba(27,31,59,.35);
  display: grid; place-items: center; background: rgba(255,255,255,.25);
}
.basket-slot.filled { border-style: solid; border-color: var(--ink); background: #FFF7D6; animation: popIn .35s; }

/* Top Bar (#top / .pb) & Bottom Nav (#nav) */
#top {
  position: sticky; top: 0; z-index: 30; background: var(--sky2);
  border-bottom: 3px solid var(--ink); width: 100vw; margin-left: calc(50% - 50vw);
  padding: 8px var(--gut-r) 8px var(--gut-l);
}
.top-inner { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.havatar {
  width: 48px; height: 48px; flex: none; background: #fff; border: 3px solid var(--ink);
  border-radius: 50%; overflow: hidden; box-shadow: 0 3px 0 var(--ink); padding: 2px;
}
.havatar .crt { animation: none; }
.pb-wrap { flex: 1; display: grid; gap: 4px; }
.pb {
  height: 16px; background: #fff; border: 3px solid var(--ink); border-radius: 99px; overflow: hidden;
}
.pb i { display: block; height: 100%; background: var(--leaf); transition: width .4s; }
.counters { display: flex; gap: 6px; align-items: center; }
.cnt {
  display: inline-flex; align-items: center; gap: 4px; background: #fff;
  border: 3px solid var(--ink); border-radius: 99px; padding: 3px 10px;
  font: 800 16px var(--f-display); box-shadow: 0 3px 0 var(--ink);
}
#nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: #fff; border-top: 3px solid var(--ink);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
}
.nav-inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.navb {
  display: grid; justify-items: center; gap: 2px; padding: 6px 4px;
  border-radius: 16px; border: 2px solid transparent; font: 800 13px var(--f-display); color: var(--ink2);
}
.navb.on { background: var(--sun); border-color: var(--ink); color: var(--ink); box-shadow: 0 3px 0 var(--ink); }
.navb svg { width: 30px; height: 30px; }

/* Home & Level Map (lv) */
.pane { padding: 14px 0 104px; display: grid; gap: 14px; }
.trtabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.trtab {
  display: grid; justify-items: center; gap: 2px; padding: 10px 4px;
  border: 3px solid var(--ink); border-radius: 18px; background: #fff;
  box-shadow: 0 4px 0 var(--ink); font: 800 18px var(--f-display);
}
.trtab.on { background: var(--c); color: #fff; transform: translateY(-2px); }
.tr-ico { font-size: 26px; line-height: 1; }
.chap { background: #fff; border: 3px solid var(--ink); border-radius: 24px; box-shadow: var(--shadow); overflow: hidden; }
.chap.locked { opacity: .68; }
.chead {
  display: flex; gap: 10px; align-items: center; padding: 10px 14px;
  background: var(--tint); border-bottom: 3px solid var(--ink);
}
.cbadge {
  width: 44px; height: 44px; border-radius: 14px; background: #fff; border: 3px solid var(--ink);
  display: grid; place-items: center; font-size: 24px; flex: none;
}
.nodes {
  display: flex; justify-content: space-around; align-items: center;
  padding: 28px 10px 24px; position: relative;
}
.nodes::before {
  content: ""; position: absolute; left: 32px; right: 32px; top: 50%;
  border-top: 4px dashed var(--mute); z-index: 0;
}
.node {
  position: relative; z-index: 1; width: 60px; height: 60px; border-radius: 50%;
  border: 3px solid var(--ink); background: var(--mute);
  font: 800 24px var(--f-display); display: grid; place-items: center;
  box-shadow: 0 4px 0 var(--ink);
}
.node.unl { background: var(--sun); }
.node.done { background: var(--leaf); color: #fff; }
.node.boss { width: 68px; height: 68px; border-radius: 20px; background: #fff; padding: 4px; }
.node.boss.unl { background: #FFE0D6; }
.node.boss.done { background: var(--good); }
.nst { position: absolute; top: 100%; margin-top: 4px; display: flex; }
.nst .ico { width: 14px; height: 14px; }
.mark { position: absolute; bottom: 100%; width: 42px; margin-bottom: 2px; pointer-events: none; }

/* Lesson & Pre-Symbol Training Wheels */
.lsn { min-height: 92dvh; display: flex; flex-direction: column; justify-content: space-between; padding-bottom: 16px; }
.qwrap { display: grid; gap: 14px; margin-top: 10px; }
.teach { display: flex; gap: 10px; align-items: center; }
.tav { width: 84px; flex: none; }
.bubble {
  position: relative; flex: 1; background: #fff; border: 3px solid var(--ink);
  border-radius: 20px; padding: 10px 14px; font: 800 21px/1.25 var(--f-display);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  box-shadow: 0 4px 0 var(--ink);
}
.spk {
  width: 48px; height: 48px; flex: none; display: grid; place-items: center;
  border-radius: 50%; background: var(--lake); color: #fff;
  border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink);
}
.spk.speaking { animation: nextPulse .9s infinite; background: var(--sun); color: var(--ink); }
.visual {
  display: grid; justify-items: center; align-content: center; background: #fff;
  border: 3px solid var(--ink); border-radius: 24px; padding: 16px;
  min-height: 116px; box-shadow: var(--shadow); text-align: center;
}
.pre-pairs {
  display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center;
  padding: 8px 14px; background: var(--soft); border: 3px solid var(--ink); border-radius: 20px;
}
.fruit-token {
  font-size: 42px; line-height: 1; display: inline-block; animation: popIn .35s backwards;
}
.fruit-drop {
  min-height: 88px; min-width: 180px; padding: 10px 16px;
  background: #FFF9E2; border: 3px dashed var(--ink); border-radius: 22px;
  display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap;
}
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.answers.n3 { grid-template-columns: repeat(3, 1fr); }
.opt {
  min-height: 92px; padding: 10px; background: #fff; border: 3px solid var(--ink);
  border-radius: 22px; box-shadow: var(--shadow); font: 800 28px/1.1 var(--f-display);
  display: grid; place-items: center; transition: transform .1s, background .15s;
}
.opt:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.opt.right { background: var(--good); animation: rightPop .45s; }
.opt.soft-miss { animation: gentleWobble .4s; }
.bigemoji { font-size: 74px; line-height: 1.05; }
.bignum { font: 800 72px/1 var(--f-display); color: var(--lake-d); }
.bigletter { font: 800 92px/1 var(--f-display); color: var(--clay); }
.dual-box { display: flex; align-items: center; gap: 18px; justify-content: center; }

/* Mini-Games Strip */
.gamegrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.gcard {
  display: grid; justify-items: center; gap: 6px; padding: 14px 10px;
  background: #fff; border: 3px solid var(--ink); border-radius: 22px; box-shadow: var(--shadow);
}
.gart {
  width: 72px; height: 72px; border-radius: 20px; background: var(--c);
  border: 3px solid var(--ink); display: grid; place-items: center; font-size: 38px;
}

/* Modals, Toasts, FX */
.modal {
  position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center;
  background: rgba(27,31,59,.55); padding: 16px;
}
.msheet {
  width: min(100%, 440px); max-height: 90dvh; overflow: auto;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 26px;
  padding: 20px; text-align: center; display: grid; gap: 12px; box-shadow: 0 8px 0 var(--ink);
}
.mfoot { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.mfoot > * { flex: 1 1 120px; }
.textin {
  width: 100%; font: 800 22px var(--f-display); padding: 10px 14px;
  border: 3px solid var(--ink); border-radius: 16px; background: #fff;
}
.toast {
  position: fixed; left: 50%; top: 72px; transform: translateX(-50%);
  background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 16px;
  font: 800 18px var(--f-display); z-index: 90; text-align: center;
}
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 92; overflow: hidden; }
.cf {
  position: absolute; width: 10px; height: 14px; border-radius: 3px; border: 2px solid var(--ink);
  animation: cf 900ms cubic-bezier(.1,.7,.4,1) forwards;
}
@keyframes cf { to { transform: translate(var(--dx), calc(var(--dy) + 140px)) rotate(320deg); opacity: 0; } }
.boma {
  display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; padding: 8px;
  background: linear-gradient(180deg, #BDE9FF 0 32%, #9BDB7B 32%);
  border: 3px solid var(--ink); border-radius: 20px;
}
.cell { aspect-ratio: 1; border-radius: 10px; background: rgba(255,255,255,.35); display: grid; place-items: center; font-size: 26px; }
.guest-row { text-align: left; background: var(--soft); padding: 8px 12px; border-radius: 12px; border: 2px solid var(--ink); font-size: 15px; }
</style>
</head>
<body>
<div id="bg" aria-hidden="true"><div class="cloud c1"></div><div class="cloud c2"></div><div class="hills"></div></div>
<div id="app"></div>
<div id="sub" aria-live="polite"></div>
<div id="fx"></div>

<script>
(function () {
'use strict';

/* ===================== 1. CUSTOM INLINE SVGs (IC) & CHARACTERS ===================== */
const INK = '#1B1F3B';
const ST = `stroke="${INK}" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"`;
const ST2 = `stroke="${INK}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"`;

/* ===================== 2. RESILIENT AUDIO & SUBTITLES (ding, say, voicePump) ===================== */
const AU = { ctx: null, voices: [], pumpTimer: null, subTimer: null };
function actx() {
  if (!AU.ctx) {
    try { AU.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (AU.ctx && AU.ctx.state === 'suspended') {
    try { AU.ctx.resume(); } catch (e) {}
  }
  return AU.ctx;
}
function loadVoices() {
  try { AU.voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; } catch (e) { AU.voices = []; }
}
try { if (window.speechSynthesis) { loadVoices(); window.speechSynthesis.onvoiceschanged = loadVoices; } } catch (e) {}

function ding(kind = 'tap') {
  const c = actx(); if (!c) return;
  const playNote = (freq, dur, type, vol, delay = 0) => {
    const t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  };
  if (kind === 'good') {
    [523, 659, 784, 1047].forEach((f, i) => playNote(f, 0.16, 'triangle', 0.13, i * 0.07));
  } else if (kind === 'soft') {
    // Gentle errorless woodblock tap (no harsh buzzer)
    playNote(330, 0.14, 'sine', 0.07, 0);
    playNote(294, 0.16, 'sine', 0.06, 0.09);
  } else if (kind === 'cue') {
    // Warm marimba fallback chime when TTS voice pack is unavailable
    playNote(587, 0.14, 'triangle', 0.09, 0);
    playNote(784, 0.18, 'triangle', 0.09, 0.1);
  } else if (kind === 'coin') {
    playNote(988, 0.08, 'triangle', 0.08, 0);
    playNote(1319, 0.15, 'triangle', 0.08, 0.07);
  } else {
    playNote(540, 0.07, 'triangle', 0.08, 0);
  }
}

function voicePump(text, lang) {
  clearInterval(AU.pumpTimer);
  clearTimeout(AU.subTimer);
  const sub = document.getElementById('sub');
  const spk = document.querySelector('.spk');
  if (spk) spk.classList.add('speaking');
  if (!sub || !text) return;

  const words = text.trim().split(/\s+/);
  let idx = 0;
  const renderWords = () => {
    sub.innerHTML = words.map((w, i) => i === idx ? `<span class="hl">${w}</span>` : w).join(' ');
    sub.classList.add('on');
  };
  renderWords();

  AU.pumpTimer = setInterval(() => {
    idx++;
    if (idx < words.length) {
      renderWords();
    } else {
      clearInterval(AU.pumpTimer);
      AU.subTimer = setTimeout(() => {
        sub.classList.remove('on');
        if (spk) spk.classList.remove('speaking');
      }, 900);
    }
  }, 380);
}

function say(swText, enText) {
  const lang = C.lang || 'sw';
  const text = lang === 'sw' ? (swText || enText) : (enText || swText);
  if (!text) return;

  voicePump(text, lang);

  const synth = window.speechSynthesis;
  const hasUtterance = typeof window.SpeechSynthesisUtterance !== 'undefined';
  if (!synth || !hasUtterance) {
    ding('cue');
    return;
  }

  loadVoices();
  const targetPrefix = lang === 'sw' ? /^sw/i : /^en/i;
  const voice = AU.voices.find(v => targetPrefix.test(v.lang)) || (lang === 'en' ? AU.voices[0] : null);

  // If Swahili TTS voice pack is missing on the device, fall back to a melodic chime + visual subtitle pump
  if (lang === 'sw' && !voice) {
    ding('cue');
    return;
  }

  try {
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if (voice) { u.voice = voice; u.lang = voice.lang; }
    else { u.lang = lang === 'sw' ? 'sw-TZ' : 'en-GB'; }
    u.rate = 0.92;
    u.pitch = 1.15;
    u.onerror = () => ding('cue');
    synth.speak(u);
  } catch (e) {
    ding('cue');
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.profiles)) {
        ST_DATA = Object.assign(ST_DATA, parsed);
      }
    }
  } catch (e) {}
  // Auto-initialize sensible default learner so the child is never blocked
  if (!ST_DATA.profiles.length) {
    const p = defaultProfile('Rafiki', 'simba');
    ST_DATA.profiles.push(p);
    ST_DATA.activeId = p.id;
    saveState();
  }
  if (!ST_DATA.activeId || !ST_DATA.profiles.find(p => p.id === ST_DATA.activeId)) {
    ST_DATA.activeId = ST_DATA.profiles[0].id;
  }
}

function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(ST_DATA)); } catch (e) {}
}

function P() {
  return ST_DATA.profiles.find(p => p.id === ST_DATA.activeId) || ST_DATA.profiles[0];
}

const C = {

  track: 'num',

  microPicked: 0,
  lesson: null,
  idleTimer: null,
  guestName: ''
};

function clearGhostHand() {
  const old = document.querySelector('.ghost-hand');
  if (old) old.remove();
}

function showGhostHand() {
  clearGhostHand();
  let target = null;
  let mode = 'tap';
  let dx = 0, dy = 130;

  if (C.scr === 'start') {
    target = document.querySelector('.play-cta');
  } else if (C.scr === 'micro') {
    target = document.querySelector('.mango-btn:not(.picked)');
    const basket = document.querySelector('.basket-zone');
    if (target && basket) {
      mode = 'drag';
      const r1 = target.getBoundingClientRect();
      const r2 = basket.getBoundingClientRect();
      dx = (r2.left + r2.width / 2) - (r1.left + r1.width / 2);
      dy = (r2.top + r2.height / 2) - (r1.top + r1.height / 2);
    }
  } else if (C.scr === 'home' && C.tab === 'lv') {
    target = document.querySelector('.next-pulse') || document.querySelector('.node.unl');
  } else if (C.scr === 'lesson') {
    target = document.querySelector('.opt:not(.gone)');
  }

  if (!target) return;
  const r = target.getBoundingClientRect();
  if (!r.width || !r.height) return;

  const h = document.createElement('div');
  h.className = `ghost-hand ${mode}`;
  h.style.left = (r.left + r.width * 0.45) + 'px';
  h.style.top = (r.top + r.height * 0.45) + 'px';
  if (mode === 'drag') {
    h.style.setProperty('--dx', dx + 'px');
    h.style.setProperty('--dy', dy + 'px');
  }
  h.innerHTML = IC.hand;
  document.body.appendChild(h);
}

function resetIdle() {
  clearTimeout(C.idleTimer);
  clearGhostHand();
  if (['start', 'micro', 'home', 'lesson'].includes(C.scr)) {
    C.idleTimer = setTimeout(showGhostHand, 4000);
  }
}
['pointerdown', 'keydown', 'touchstart'].forEach(ev => {
  document.addEventListener(ev, () => { actx(); resetIdle(); }, { passive: true });
});

function go(scr, extra = {}) {
  Object.assign(C, extra, { scr });
  render();
  resetIdle();
}

function confetti(x, y, count = 18) {
  const fx = document.getElementById('fx');
  const cols = ['#FFC933', '#2DB84C', '#1EA0E0', '#E8572A', '#FF5FA2'];
  for (let i = 0; i < count; i++) {
    const el = document.createElement('i');
    el.className = 'cf';
    const a = Math.random() * Math.PI * 2;
    const dist = 50 + Math.random() * 110;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.background = cols[i % cols.length];
    el.style.setProperty('--dx', (Math.cos(a) * dist).toFixed(0) + 'px');
    el.style.setProperty('--dy', (Math.sin(a) * dist - 50).toFixed(0) + 'px');
    fx.appendChild(el);
    setTimeout(() => el.remove(), 950);
  }
}

          html: `<span class="bigletter" style="font-size:54px">${p.ch}</span>`,
          correct: p.ch === target.ch,
          saySw: `${p.ch}... ${p.word}`,
          sayEn: `${p.ch}... ${p.word}`
        }));
        return {
          swPrompt: `${target.word} huanza na herufi gani?`,
          enPrompt: `Which letter starts ${target.word}?`,
          visual: `<div style="width:94px">${target.svg()}</div>`,
          opts,
          cols: 2
        };
      }
    }
  ],
  eng: [
    {
      id: 'e0', stage: 'pre', badge: '👂🥭',
      sw: 'Sauti na Picha', en: 'Sound to Picture',
      makeQ: (step) => CHAPTERS.kis[0].makeQ(step + 1)
    },
    {
      id: 'e1', stage: 'bridge', badge: 'Ll 🦁',
      sw: 'Alfabeti', en: 'Letter Bridge',
      makeQ: (step) => {
        const pairs = [
          { ch: 'L', word: 'Lion', svg: () => IC.simba('happy') },
          { ch: 'E', word: 'Elephant', svg: () => IC.tembo('happy') },
          { ch: 'C', word: 'Cat', svg: () => IC.paka('happy') },
          { ch: 'M', word: 'Mango', svg: () => IC.embe() }
        ];
        const target = pairs[step % pairs.length];
        const others = pairs.filter(x => x.ch !== target.ch).slice(0, 3);
        const opts = [target, ...others].sort(() => Math.random() - 0.5).map(p => ({
          id: p.ch,
          html: `<span class="bigletter" style="font-size:54px">${p.ch}</span>`,
          correct: p.ch === target.ch,
          saySw: `${p.ch}... ${p.word}`,
          sayEn: `${p.ch}... ${p.word}`
        }));
        return {
          swPrompt: `Herufi ya kwanza ya ${target.word}?`,
          enPrompt: `First letter of ${target.word}?`,
          visual: `<div style="width:94px">${target.svg()}</div>`,
          opts,
          cols: 2
        };
      }
    }
  ]
};

/* ===================== 6. SCREENS RENDERER ===================== */
function topBarHTML(progressPct = null) {
  const p = P();
  return `<header id="top"><div class="top-inner">
    <button class="havatar" data-act="goSetup" aria-label="Buddy">${buddySVG(p.buddy, 'happy')}</button>
    <div class="pb-wrap">
      ${progressPct !== null ? `<div class="pb"><i style="width:${progressPct}%"></i></div>` : `<b style="font:800 19px var(--f-display)">${p.name}</b>`}
    </div>
    <div class="counters">
      <span class="cnt">${IC.coin}<b>${p.coins}</b></span>
      <span class="cnt">${IC.star}<b>${p.stars}</b></span>
      <button class="iconbtn" data-act="openGear" aria-label="Caregiver">${IC.gear}</button>
    </div>
  </div></header>`;
}

function navBarHTML() {
  const items = [
    { id: 'lv', icon: '🗺️', sw: 'Safari', en: 'Path' },
    { id: 'games', icon: '🎈', sw: 'Michezo', en: 'Play' },
    { id: 'soko', icon: '🏡', sw: 'Boma', en: 'Boma' },
    { id: 'me', icon: '🦁', sw: 'Mimi', en: 'Me' }
  ];
  return `<nav id="nav"><div class="nav-inner">${items.map(it => `
    <button class="navb ${C.tab === it.id ? 'on' : ''}" data-act="setTab" data-tab="${it.id}">
      <span style="font-size:24px;line-height:1">${it.icon}</span>
      <span>${C.lang === 'sw' ? it.sw : it.en}</span>
    </button>`).join('')}</div></nav>`;
}

function renderStart() {
  const hasSaved = ST_DATA.firstRunDone && ST_DATA.profiles.length > 0;
  return `<div class="start-scr">
    <div class="strip"></div>
    <div class="start-top">
      <div class="langtog">
        <button class="${C.lang === 'sw' ? 'on' : ''}" data-act="lang" data-l="sw">SW</button>
        <button class="${C.lang === 'en' ? 'on' : ''}" data-act="lang" data-l="en">EN</button>
      </div>
      <button class="iconbtn" data-act="openGear" aria-label="Caregiver">${IC.gear}</button>
    </div>
    <div class="start-hero">
      <div class="start-cast">
        <div class="c-side">${IC.twiga('cheer')}</div>
        <div class="c-main">${IC.simba('cheer')}</div>
        <div class="c-side">${IC.tembo('happy')}</div>
      </div>
      <h1 class="start-title">Elimika</h1>
      <button class="play-cta go play" data-act="instantPlay" aria-label="Play">${IC.play}</button>
    </div>
    ${hasSaved ? `<div class="start-profiles">${ST_DATA.profiles.map(pr => `
      <button class="mini-prof" data-act="pickProf" data-id="${pr.id}">
        <span class="av">${buddySVG(pr.buddy, 'happy')}</span>
        <span>${pr.name}</span>
      </button>`).join('')}</div>` : '<div></div>'}
  </div>`;
}

function renderMicro() {
  // Phase 0: 3-tap Mango Basket Micro-Activity (Seconds 0-15)
  const picked = C.microPicked;
  return `<div class="micro-scr">
    <div class="strip"></div>
    <div style="width:100%;display:flex;justify-content:space-between;align-items:center;padding-top:10px">
      <div style="width:72px">${IC.twiga(picked >= 3 ? 'cheer' : 'happy')}</div>
      <button class="spk" data-act="replayMicro">${IC.speaker}</button>
    </div>
    <div class="micro-tree">
      ${[0, 1, 2].map(i => `
        <button class="mango-btn ${i < picked ? 'picked' : ''}" data-act="pickMango" data-i="${i}" aria-label="Embe">
          ${IC.embe()}
        </button>`).join('')}
    </div>
    <div class="basket-zone">
      ${[0, 1, 2].map(i => `
        <div class="basket-slot ${i < picked ? 'filled' : ''}">
          ${i < picked ? IC.embe() : ''}
        </div>`).join('')}
    </div>
  </div>`;
}

function renderLvTab() {
  const p = P();
  const tracks = [
    { id: 'num', ico: '🍌', sw: 'Kiasi & 123', en: 'Count & 123', c: '#2DB84C' },
    { id: 'kis', ico: '🦁', sw: 'Kiswahili', en: 'Kiswahili', c: '#E8572A' },
    { id: 'eng', ico: '🐘', sw: 'English', en: 'English', c: '#1EA0E0' }
  ];
  const chList = CHAPTERS[C.track];
  let foundNext = false;

  const chCards = chList.map((ch, idx) => {
    const unlocked = !!p.unl[ch.id];
    const stars = p.starsMap[ch.id] || 0;
    const isNext = unlocked && stars < 3 && !foundNext;
    if (isNext) foundNext = true;

    return `<section class="chap ${unlocked ? '' : 'locked'}" style="--tint:${idx === 0 ? '#FFE7A3' : '#D5F0FF'}">
      <div class="chead">
        <div class="cbadge">${ch.badge}</div>
        <div style="flex:1">
          <h3>${C.lang === 'sw' ? ch.sw : ch.en}</h3>
        </div>
        ${!unlocked ? IC.lock : ''}
      </div>
      <div class="nodes">
        <button class="node ${stars >= 3 ? 'done' : unlocked ? 'unl' : ''} ${isNext ? 'now next-pulse' : ''}"
          data-act="startCh" data-ch="${ch.id}" ${!unlocked ? 'disabled' : ''}>
          ${isNext ? `<span class="mark">${buddySVG(p.buddy, 'cheer')}</span>` : ''}
          ${unlocked ? (stars >= 3 ? '★' : '▶') : IC.lock}
          <span class="nst">${[1, 2, 3].map(s => s <= stars ? IC.star : IC.starOff).join('')}</span>
        </button>
      </div>
    </section>`;
  }).join('');

  return `<div class="trtabs">${tracks.map(t => `
    <button class="trtab ${C.track === t.id ? 'on' : ''}" style="--c:${t.c}" data-act="setTrack" data-tr="${t.id}">
      <span class="tr-ico">${t.ico}</span>
      <span>${C.lang === 'sw' ? t.sw : t.en}</span>
    </button>`).join('')}</div>${chCards}`;
}

function renderGamesTab() {
  const games = [
    { id: 'bub', emo: '🫧', sw: 'Povu', en: 'Bubbles', c: '#1EA0E0' },
    { id: 'mm', emo: '🃏', sw: 'Jozi', en: 'Match', c: '#FF5FA2' },
    { id: 'wb', emo: '🥭', sw: 'Kikapu', en: 'Basket', c: '#FFC933' },
    { id: 'arc', emo: '🎯', sw: 'Shabaha', en: 'Target', c: '#2DB84C' }
  ];
  return `<div class="gamegrid">${games.map(g => `
    <button class="gcard" style="--c:${g.c}" data-act="playMini" data-g="${g.id}">
      <div class="gart">${g.emo}</div>
      <b>${C.lang === 'sw' ? g.sw : g.en}</b>
    </button>`).join('')}</div>`;
}

function renderSokoTab() {
  const p = P();
  const items = ['🌴', '🏡', '🦁', '🐘', '🌻', '🥁'];
  return `<div class="card" style="display:grid;gap:12px">
    <div class="boma">${p.boma.map((cell, i) => `
      <button class="cell" data-act="bomaCell" data-i="${i}">${cell || '·'}</button>`).join('')}
    </div>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      ${items.map(it => `<button class="btn sm btn-sun" data-act="bomaPick" data-it="${it}" style="font-size:24px">${it}</button>`).join('')}
    </div>
  </div>`;
}

function renderMeTab() {
  // Visual-only companion (TU) & buddy picker — zero typing required
  const p = P();
  return `<div class="card" style="display:grid;gap:14px;text-align:center">
    <div style="width:120px;margin:0 auto">${buddySVG(p.buddy, 'cheer')}</div>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">
      ${TU_CAST.map(b => `
        <button class="card ${p.buddy === b.id ? 'glow' : ''}" data-act="pickBuddy" data-b="${b.id}" style="padding:10px">
          <div style="width:74px;margin:0 auto">${buddySVG(b.id, 'happy')}</div>
          <b>${C.lang === 'sw' ? b.sw : b.en}</b>
        </button>`).join('')}
    </div>
  </div>`;
}

function renderHome() {
  let body = '';
  if (C.tab === 'lv') body = renderLvTab();
  else if (C.tab === 'games') body = renderGamesTab();
  else if (C.tab === 'soko') body = renderSokoTab();
  else body = renderMeTab();

  return `${topBarHTML()}<main class="pane">${body}</main>${navBarHTML()}`;
}

function renderLesson() {
  const L = C.lesson;
  const pct = Math.round((L.step / L.total) * 100);
  const q = L.q;
  const mood = L.solved ? 'cheer' : (L.softTries > 0 ? 'think' : 'happy');

  return `<div class="lsn">
    ${topBarHTML(pct)}
    <div class="qwrap">
      <div class="teach">
        <div class="tav teacher-mood">${IC.twiga(mood)}</div>
        <div class="bubble">
          <span>${C.lang === 'sw' ? q.swPrompt : q.enPrompt}</span>
          <button class="spk" data-act="replayQ" aria-label="Listen">${IC.speaker}</button>
        </div>
      </div>
      <div class="visual">${q.visual}</div>
      <div class="answers ${q.cols === 3 ? 'n3' : ''}">
        ${q.opts.map(o => `
          <button class="opt ${o.gone ? 'gone' : ''} ${o.glow ? 'glow' : ''} ${o.right ? 'right' : ''}"
            data-act="pickOpt" data-id="${o.id}">
            ${o.html}
          </button>`).join('')}
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding-top:12px">
      <button class="iconbtn" data-act="exitLesson" aria-label="Back">${IC.back}</button>
      ${L.solved ? `<button class="btn btn-leaf big next-pulse" data-act="nextStep">▶</button>` : '<span></span>'}
    </div>
  </div>`;
}

/* ===================== 7. CAREGIVER GATE (pin, pinset, admin, gb) ===================== */
function openCaregiverGate() {
  const m = document.createElement('div');
  m.className = 'modal';
  m.id = 'cgModal';
  m.innerHTML = `<div class="msheet">
    <h3>Mzazi / Caregiver</h3>
    <p style="color:var(--ink2);font-size:15px">PIN (default: 1234)</p>
    <input id="pinIn" class="textin" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
    <div class="mfoot">
      <button class="btn btn-ghost" data-act="closeModal">✕</button>
      <button class="btn btn-leaf" data-act="checkPin">✓</button>
    </div>
  </div>`;
  document.body.appendChild(m);
}

function openAdminPanel() {
  const p = P();
  const m = document.getElementById('cgModal');
  if (!m) return;
  m.innerHTML = `<div class="msheet">
    <h3>Caregiver & Guestbook</h3>
    <input id="nmEdit" class="textin" value="${p.name}" placeholder="Child name">
    <input id="pinNew" class="textin" inputmode="numeric" maxlength="4" value="${ST_DATA.pin}" placeholder="New PIN">
    <div style="display:grid;gap:6px;max-height:140px;overflow:auto">
      ${(p.gb || []).map(g => `<div class="guest-row"><b>${g.who}:</b> ${g.note}</div>`).join('') || '<small>No guestbook notes yet.</small>'}
    </div>
    <input id="gbNote" class="textin" style="font-size:16px" placeholder="Guestbook note...">
    <div class="mfoot">
      <button class="btn btn-sun sm" data-act="saveAdmin">Save</button>
      <button class="btn btn-ghost sm" data-act="closeModal">Close</button>
    </div>
  </div>`;
}

/* ===================== 8. ACTIONS & INTERACTION HANDLERS ===================== */
let bomaBrush = '🌴';

const ACTIONS = {
  lang: (el) => {
    C.lang = el.dataset.l;
    ST_DATA.lang = C.lang;
    saveState();
    ding('tap');
    render();
    say(C.lang === 'sw' ? 'Kiswahili!' : 'English!');
  },
  instantPlay: () => {
    ding('good');
    C.microPicked = 0;
    go('micro');
    say('Gusa embe!', 'Tap the mango!');
  },
  replayMicro: () => say('Gusa embe!', 'Tap the mango!'),
  pickMango: (el) => {
    const idx = +el.dataset.i;
    if (el.classList.contains('picked')) return;
    el.classList.add('picked');
    C.microPicked++;
    ding('coin');
    const r = el.getBoundingClientRect();
    confetti(r.left + r.width / 2, r.top + r.height / 2, 14);
    say('Embe!', 'Mango!');

    if (C.microPicked >= 3) {
      ST_DATA.firstRunDone = true;
      const p = P();
      p.coins += 10;
      p.preDone.num = true;
      saveState();
      setTimeout(() => {
        ding('good');
        say('Hongera! Twende!', 'Great job! Let us go!');
        go('home', { tab: 'lv', track: 'num' });
      }, 850);
    } else {
      setTimeout(render, 320);
    }
  },
  pickProf: (el) => {
    ST_DATA.activeId = el.dataset.id;
    saveState();
    ding('good');
    go('home', { tab: 'lv' });
    say(`Karibu ${P().name}!`, `Welcome ${P().name}!`);
  },
  setTab: (el) => {
    C.tab = el.dataset.tab;
    ding('tap');
    render();
    const labels = { lv: ['Safari ya kujifunza', 'Learning path'], games: ['Michezo', 'Mini games'], soko: ['Boma langu', 'My Boma'], me: ['Rafiki wako', 'Your buddy'] };
    say(labels[C.tab][0], labels[C.tab][1]);
  },
  setTrack: (el) => {
    C.track = el.dataset.tr;
    ding('tap');
    render();
    const names = { num: ['Hesabu', 'Numbers'], kis: ['Kiswahili', 'Kiswahili'], eng: ['Kiingereza', 'English'] };
    say(names[C.track][0], names[C.track][1]);
  },
  goSetup: () => {
    C.tab = 'me';
    ding('tap');
    render();
    say('Chagua rafiki yako!', 'Pick your animal friend!');
  },
  pickBuddy: (el) => {
    const p = P();
    p.buddy = el.dataset.b;
    saveState();
    ding('good');
    const b = TU_CAST.find(x => x.id === p.buddy);
    say(b.sw + '!', b.en + '!');
    render();
  },
  startCh: (el) => {
    const chId = el.dataset.ch;
    const ch = CHAPTERS[C.track].find(x => x.id === chId);
    if (!ch) return;
    ding('good');
    C.lesson = {
      chId,
      track: C.track,
      step: 0,
      total: 4,
      softTries: 0,
      solved: false,
      q: ch.makeQ(0)
    };
    go('lesson');
    say(C.lesson.q.swPrompt, C.lesson.q.enPrompt);
  },
  replayQ: () => {
    if (C.lesson) say(C.lesson.q.swPrompt, C.lesson.q.enPrompt);
  },
  pickOpt: (el) => {
    const L = C.lesson;
    if (!L || L.solved) return;
    const opt = L.q.opts.find(o => o.id === el.dataset.id);
    if (!opt || opt.gone) return;

    if (opt.correct) {
      opt.right = true;
      L.solved = true;
      ding('good');
      const r = el.getBoundingClientRect();
      confetti(r.left + r.width / 2, r.top + r.height / 2, 22);
      say('Safi sana! ' + opt.saySw, 'Great job! ' + opt.sayEn);
      render();
    } else {
      // Phase 2 Errorless Learning: Softly fade non-target option & gently guide toward target
      opt.gone = true;
      L.softTries++;
      ding('soft');
      const target = L.q.opts.find(o => o.correct);
      if (target && L.softTries >= 1) target.glow = true;
      say(L.q.swPrompt, L.q.enPrompt);
      render();
    }
  },
  nextStep: () => {
    const L = C.lesson;
    if (!L) return;
    L.step++;
    if (L.step >= L.total) {
      const p = P();
      p.starsMap[L.chId] = 3;
      p.stars += 3;
      p.coins += 15;
      // Unlock next chapter in sequence
      const list = CHAPTERS[L.track];
      const idx = list.findIndex(x => x.id === L.chId);
      if (idx >= 0 && list[idx + 1]) p.unl[list[idx + 1].id] = true;
      p.preDone[L.track] = true;
      saveState();
      ding('good');
      say('Hongera! Umepata nyota tatu!', 'Awesome! You earned three stars!');
      C.lesson = null;
      go('home', { tab: 'lv' });
      return;
    }
    const ch = CHAPTERS[L.track].find(x => x.id === L.chId);
    L.softTries = 0;
    L.solved = false;
    L.q = ch.makeQ(L.step);
    render();
    say(L.q.swPrompt, L.q.enPrompt);
  },
  exitLesson: () => {
    C.lesson = null;
    ding('tap');
    go('home', { tab: 'lv' });
  },
  playMini: (el) => {
    // Quick 1-tap reward mini-game bridge into pre-symbol ear/quantity training
    const map = { bub: 'num', mm: 'kis', wb: 'num', arc: 'eng' };
    C.track = map[el.dataset.g] || 'num';
    const ch = CHAPTERS[C.track][0];
    ACTIONS.startCh({ dataset: { ch: ch.id } });
  },
  bomaPick: (el) => {
    bomaBrush = el.dataset.it;
    ding('tap');
  },
  bomaCell: (el) => {
    const p = P();
    const idx = +el.dataset.i;
    p.boma[idx] = p.boma[idx] === bomaBrush ? null : bomaBrush;
    saveState();
    ding('coin');
    render();
  },
  openGear: () => {
    ding('tap');
    openCaregiverGate();
  },
  closeModal: () => {
    const m = document.getElementById('cgModal');
    if (m) m.remove();
  },
  checkPin: () => {
    const val = (document.getElementById('pinIn') || {}).value;
    if (val === ST_DATA.pin) {
      ding('good');
      openAdminPanel();
    } else {
      ding('soft');
    }
  },
  saveAdmin: () => {
    const p = P();
    const nm = (document.getElementById('nmEdit') || {}).value.trim();
    const np = (document.getElementById('pinNew') || {}).value.trim();
    const note = (document.getElementById('gbNote') || {}).value.trim();
    if (nm) p.name = nm;
    if (/^\d{4}$/.test(np)) ST_DATA.pin = np;
    if (note) {
      p.gb = p.gb || [];
      p.gb.unshift({ who: 'Mzazi', note });
    }
    saveState();
    ding('good');
    ACTIONS.closeModal();
    render();
  }
};

document.addEventListener('click', (e) => {
  if (e.target.closest('[data-replay]')) {
    ACTIONS.replayQ();
    return;
  }
  const btn = e.target.closest('[data-act]');
  if (!btn || btn.disabled) return;
  const fn = ACTIONS[btn.dataset.act];
  if (fn) fn(btn);
});

function render() {
  const app = document.getElementById('app');
  document.body.dataset.scr = C.scr;
  if (C.scr === 'start') app.innerHTML = renderStart();
  else if (C.scr === 'micro') app.innerHTML = renderMicro();
  else if (C.scr === 'lesson') app.innerHTML = renderLesson();
  else app.innerHTML = renderHome();
}

/* ===================== BOOT ===================== */
loadState();
C.lang = ST_DATA.lang || 'sw';
render();
resetIdle();
})();
</script>
</body>
</html>
