 else if(t==='same'){msg=stage===1?L('Linganisha kitu kimoja na kimoja.','Match one thing to one thing.'):L('Kila kitu kina mwenzake. Tafuta kundi kama hili.','Each thing has a partner. Find a group like this.');if(stage>=2)visual=coachPairs(a,f,OB[(Number(a)+1)%4])}

V.warm=()=>{let w=C.wu,q=w.qs[w.i],prompt=warmPrompt(q),moving=['sort','group'].includes(q.kind),model=moving?`<button class=warm-token onclick="say(warmPrompt(C.wu.qs[C.wu.i]))" aria-label="${warmName(q.target)}" title="${L('Buruta','Drag')}">${ic(q.target,70)}</button>`:q.kind==='pattern'?q.seq.map(x=>ic(x,57)).join('')+'<span class=warm-slot>?</span>':q.model;return[`<h2>${L('Mazoezi ya asubuhi','Daily warm-up')}</h2><div class=warm-trail>${w.qs.map((_,i)=>`<span class="${i<w.i?'done':i===w.i?'current':''}">${ic(i<w.i?'star':'flower',24)}</span>`).join('')}</div><div class="warm-stage"><div class=tc>${ic(S.fr||'hen',60)}</div><div class=question-label>${prompt}</div><div class=warm-model>${model}</div><div class=warm-hint aria-live=polite>${moving?L('Buruta au gusa mara mbili.','Drag or tap twice.'):''}</div></div><div class="warm-choices">${q.opts.map((x,i)=>`<button class="k opt" data-warm="${i}" aria-label="${L('Chaguo','Choice')} ${i+1}" onclick="warmSelect(this,${i})">${warmOption(q,x)}</button>`).join('')}</div><div class=row><button class="k b" onclick="say(warmPrompt(C.wu.qs[C.wu.i]))" aria-label="${L('Sikiliza','Listen')}">${ic('speaker',32)}</button></div>`,prompt,"go('home')"]};
function warmSelect(el,i,drop=false){let w=C.wu;if(C.scr!=='warm'||w.locked||!el?.isConnected)return;let q=w.qs[w.i],x=q.opts[i],answer=q.kind==='sort'?q.target:q.answer;if(!drop&&w.selected!==i){w.selected=i;document.querySelectorAll('.warm-choices .opt').forEach(b=>{b.classList.remove('sel');b.setAttribute('aria-pressed','false')});el.classList.add('sel');el.dataset.c=L('Gusa tena','Tap again');el.setAttribute('aria-pressed','true');return}w.selected=null;el.classList.remove('sel');el.setAttribute('aria-pressed','false');let ok=x===answer;if(q.kind==='review'){if(!q.proxy)reviewOnce(q,q.tr,q.a,q.type,ok&&!w.miss)}else reviewOnce(q,'w',q.a,q.kind,ok&&!w.miss);ding(ok);teacherReact(ok?'win':'miss');if(!ok){w.miss++;el.classList.remove('no');void el.offsetWidth;el.classList.add('no');let msg=q.kind==='sort'?L('Angalia tunda. Tafuta tunda lilelile.','Look at the fruit. Find the exact same fruit.'):q.kind==='group'?L('Wanyama waende na wanyama, matunda na matunda.','Animals go with animals. Fruits go with fruits.'):q.kind==='pattern'?L('Angalia picha zinazojirudia. Ni picha gani inayofuata?','Look at the pictures that repeat. Which picture comes next?'):L('Angalia au sikiliza mfano tena.','Look or listen to the example again.');$('.warm-hint').textContent=msg;say(msg,'feedback');if(w.miss>=2&&q.kind==='pattern'&&q.unit){let h=$('.warm-hint');h.innerHTML='';let line=document.createElement('div');line.className='warm-repeat';line.innerHTML=q.unit.map(x=>ic(x,28)).join('')+' <span>↻</span> '+q.unit.map(x=>ic(x,28)).join('');h.append(line)}if(w.miss>=2)document.querySelectorAll('.warm-choices .opt').forEach((b,j)=>b.classList.toggle('coach-guide',q.opts[j]===answer));return}w.locked=true;document.querySelectorAll('.warm-choices .opt').forEach(b=>b.disabled=true);el.classList.add('ok');if(q.kind==='sort'||q.kind==='group'){$('.warm-token')?.remove();el.insertAdjacentHTML('beforeend',ic(q.target,34))}burst(el,'',8);say(L('Vizuri!','Well done!'),'feedback');later(()=>{if(C.scr!=='warm'||C.wu!==w)return;w.i++;w.miss=0;w.locked=false;if(w.i>=w.qs.length){let reward=warmClaim();return go('warmWin',reward)}render()},850)}
function warmClaim(){let t=today(),bonus=S.warmDay!==t,streakNew=!S.days.includes(t);if(bonus){S.warmDay=t;S.coins+=8;if(streakNew){S.days.push(t);S.days=S.days.slice(-60)}sv()}return{warmBonus:bonus,warmStreak:days(),warmStreakNew:bonus&&streakNew}}

const handsPreMake=preMake,handsPreView=V.precursor,handsMk=mk,handsQv=qv,handsHint=hint,handsPreCoach=preCoach;
function handsSet(q,kind,items,prompt){q.hands={kind,items,prompt,chosen:[],locked:false};return q.hands}
function handsFruit(q,pre=false){let a=Number(q.a),f=R(OB),g=R(OB.filter(x=>x!==f));let h=handsSet(q,pre?'pair':'collect',Array.from({length:Math.min(12,a+2)},(_,i)=>({v:g,id:i})),pre?L('Weka tunda moja kwa kila tunda lililo juu.','Put one fruit under each fruit above.'):fruitPrompt(a,g));h.model=pre?'':`<div class=num>${a}</div>`;h.goal=a;h.chosen=Array(a).fill(null);h.fruit=g;h.sample=f}
function handsMatch(q,pre=false){let h=handsSet(q,'match',q.o.map((v,i)=>({v,id:i})),pre?q.prompt:L('Buruta au gusa kinachofanana.','Drag or tap the matching one.'));h.model=pre?q.model:`<div class=num>${q.a}</div>`;h.goal=1;h.visual=pre}
function handsWord(q){let parts=WS[q.a];if(!parts||parts.length<2)return false;let h=handsSet(q,'word',SH(parts.map((v,id)=>({v,id}))),L('Panga silabi ili kutengeneza neno '+q.a+'.','Put the syllables in order to make '+q.a+'.'));h.model=ic(AB[q.a][0],76);h.goal=parts.length;h.chosen=Array(h.goal).fill(null);h.parts=parts;return true}
preMake=function(){handsPreMake();let q=C.preQ,j=C.preIndex,p=C.preStep;if(C.tr==='n'&&(j+p)%2===0)handsFruit(q,true)};
mk=function(){handsMk();let q=C.q;if(!q||q.speed||C.tq||C.vq||C.na||!['p','t','q','m','z'].includes(C.m))return;let j=C.qi||0;if(C.tr==='n'&&Number.isInteger(q.a)&&q.a>0&&!q.fruit&&j%3===1&&(!q.type||['count','basket'].includes(q.type))){q.type='basket';q.fruit=R(OB)}else if(C.tr==='l'&&j%3===1&&q.a.length>=4&&WS[q.a]?.length>1){q.type='wordbuild';handsWord(q)}};
function handsIcon(h,v){return h.kind==='word'?`<b>${v}</b>`:h.kind==='match'?(h.visual?ic(v,70):`<b>${v}</b>`):ic(v,48)}
function handsHTML(q){let h=q.hands,full=h.chosen.filter(x=>x!=null).length===h.goal;return `<section class=hands><div class=hands-model ${h.model?'':'hidden'}>${h.model}</div><div class=hands-target aria-label="${L('Weka hapa','Put here')}">${Array.from({length:h.goal},(_,i)=>{let item=h.items.find(x=>x.id===h.chosen[i]);return `<button class="hands-slot ${item?'filled':''}" data-hslot=${i} onclick="handsRemove(${i})" aria-label="${L('Nafasi','Space')} ${i+1}${item?' · '+L('Gusa kuondoa','Tap to remove'):''}">${h.kind==='pair'?ic(h.sample,46):''}<span>${item?handsIcon(h,item.v):'+'}</span></button>`}).join('')}</div><div class=hands-bank>${h.items.map(x=>`<button class="k hands-token" data-hid=${x.id} onclick="handsAdd(${x.id})" ${h.chosen.includes(x.id)?'disabled':''}>${handsIcon(h,x.v)}</button>`).join('')}</div><div class=hands-actions><button class="k b" onclick="handsClear()" aria-label="${L('Anza tena','Start again')}">${ic('undo',30)}</button><button class="k b hands-check" onclick="handsCheck(this)" ${full?'':'disabled'}>${ic('check',34)} ${L('Tayari','Done')}</button></div><small role=status>${L('Buruta au gusa.','Drag or tap.')}</small></section>`}
function handsCurrent(){return C.scr==='precursor'?C.preQ:C.scr==='lesson'?C.q:null}
function handsReady(q){return q?.hands&&!q.hands.locked&&!C.busy&&!C.preBusy}
function handsRefresh(q){let root=$('.hands');if(root)root.outerHTML=handsHTML(q)}
function handsAdd(id,slot){let q=handsCurrent();if(!handsReady(q))return;let h=q.hands;if(h.chosen.includes(id)||!h.items.some(x=>x.id===id))return;let i=Number.isInteger(slot)&&slot>=0&&slot<h.goal?slot:h.chosen.findIndex(x=>x==null);if(i<0)return;h.chosen[i]=id;handsRefresh(q);if(h.kind==='word')say(h.items.find(x=>x.id===id).v,'count')}
function handsRemove(i){let q=handsCurrent();if(!handsReady(q)||q.hands.chosen[i]==null)return;q.hands.chosen[i]=null;handsRefresh(q)}
function handsClear(){let q=handsCurrent();if(!handsReady(q))return;q.hands.chosen=Array(q.hands.goal).fill(null);handsRefresh(q)}
function handsCheck(el){let q=handsCurrent();if(!handsReady(q))return;let h=q.hands;if(h.chosen.some(x=>x==null))return;let v=h.chosen.map(id=>h.items.find(x=>x.id===id).v);let ok=h.kind==='word'?v.every((x,i)=>x===h.parts[i]):v.length===h.goal;if(ok){h.locked=true;$('.hands')?.querySelectorAll('button').forEach(b=>b.disabled=true)}let wrong=typeof q.a==='number'?0:'__wrong__';if(C.scr==='precursor')prePick(el,ok?q.a:wrong);else pk(el,ok?q.a:wrong)}
function handsCue(q,pre){let h=q.hands,msg;if(h.kind==='word'){msg=L('Sikiliza silabi kwa mpangilio: ','Listen to the syllables in order: ')+h.parts.join(' … ')}else if(h.kind==='match'){msg=pre&&q.kind==='listen'?q.prompt:L('Angalia mfano. Tafuta kinachofanana.','Look at the example. Find the same one.')}else msg=pre?L('Weka tunda moja chini ya kila tunda.','Put one fruit under each fruit.'):L('Gusa tunda moja baada ya jingine.','Tap one fruit at a time.');coach(msg,$('#m .chalk'),h.kind==='word'?`<div class=syl>${h.parts.map(x=>`<span>${x}</span>`).join('')}</div>`:'')}
hint=function(w){if(C.q?.hands){C.f=1;C.h=(C.h||0)+1;return handsCue(C.q,false)}return handsHint(w)};

qv=function(){let q=C.q;if(!q?.hands)return handsQv();let h=q.hands;return[stp()+combo()+(C.m==='z'?bossUI():'')+`<div class=stp>${Array.from({length:C.tot},(_,i)=>ic('star',22,i<C.qi?'':'dim')).join('')}</div><div class=bd><div class=tc>${tu()}</div><div class=chalk><div class=question-label>${h.prompt}</div></div><button class="k hb" onclick="hint()">${ic('bulb',34)}</button></div>${handsHTML(q)}`,h.prompt,"go('lv')"]};

let activeDrag=null, suppressDragClick=null;
function dragTarget(d,x,y){let selector=d.kind==='fruit'?'[data-zone]':d.kind==='warm'?'[data-warm]':'.hands-target';let z=document.elementFromPoint(x,y)?.closest(selector);return z&&d.root.contains(z)?z:null}

document.addEventListener('pointerdown',e=>{let b=e.target.closest('.fruit-token,.warm-token,.hands-token');if(!b||b.disabled||activeDrag||e.isPrimary===false||(e.pointerType==='mouse'&&e.button!==0))return;let kind=b.matches('.fruit-token')?'fruit':b.matches('.warm-token')?'warm':'hands',root=kind==='fruit'?b.closest('.basket-game'):kind==='warm'?$('#m'):b.closest('.hands');if(!root||C.busy||C.marketBusy||(kind==='warm'&&(C.scr!=='warm'||C.wu.locked))||(kind==='hands'&&!handsReady(handsCurrent())))return;suppressDragClick=null;activeDrag={b,kind,root,id:e.pointerId,x:e.clientX,y:e.clientY,epoch:sceneEpoch,q:handsCurrent(),warm:C.wu};try{b.setPointerCapture(e.pointerId)}catch(_){} });

function endDrag(e,cancel=false){let d=activeDrag;if(!d||e.pointerId!==d.id)return;activeDrag=null;let moved=!!d.ghost;clearDrag(d);if(!moved)return;suppressDragClick={b:d.b,until:Date.now()+450};if(cancel||d.epoch!==sceneEpoch||!d.b.isConnected)return;let z=dragTarget(d,e.clientX,e.clientY);if(!z)return;if(d.kind==='fruit')fruitMove(d.b,z);else if(d.kind==='warm'&&C.scr==='warm'&&C.wu===d.warm)warmSelect(z,+z.dataset.warm,true);else if(d.kind==='hands'&&d.q===handsCurrent()){let slot=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-hslot]');handsAdd(+d.b.dataset.hid,slot?+slot.dataset.hslot:undefined)}}
